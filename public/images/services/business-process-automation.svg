<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="process automation">
<defs>
  <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#c026a3" stop-opacity=".55"/>
    <stop offset="35%" stop-color="#6d28d9" stop-opacity=".5"/>
    <stop offset="70%" stop-color="#0e7490" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#c2620a" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".35"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".10"/>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#111" stroke-opacity=".05" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="760" fill="#F5F4F0"/>
<rect width="1200" height="760" fill="url(#grid)"/>
<text x="60" y="80" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="30" font-weight="300" fill="#111" fill-opacity=".9">Process automation</text><text x="60" y="112" font-family="ui-monospace, monospace" font-size="13" fill="#111" fill-opacity=".38">intake → validate → approve → write</text>
<path d="M250,300 C290.5,300 299.5,300 340,300" fill="none" stroke="#111" stroke-opacity=".22" stroke-width="1.6"/>
